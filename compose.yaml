services:
  lucoa:
    image: "${LUCOA_IMAGE:-ghcr.io/lutvzn/lucoa:latest}"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Interface binding is NOT a source-subnet firewall. See README.md.
      # Honor the old setting so existing loopback-only .env files stay local.
      - "${LUCOA_BIND_IP:-0.0.0.0}:7317:7317"
      # Key-only SSH uses all host IPv4 interfaces, independently of the browser binding.
      - "0.0.0.0:2222:2222"
    environment:
      LUCOA_SSH_ENABLED: "${LUCOA_SSH_ENABLED:-1}"
      LUCOA_SSH_AUTHORIZED_KEYS: "${LUCOA_SSH_AUTHORIZED_KEYS:-}"
      OVIS_RUNTIME: herdr-core
      OVIS_TOKEN: "${OVIS_TOKEN:?Set OVIS_TOKEN in a private .env file or the shell}"
      OVIS_AUTO_UPDATE: "0"
      OVIS_TELEMETRY: "0"
    volumes:
      # Installations live in /opt/lucoa, not in these persistent mounts.
      - home:/home/lutvzn
      - workspace:/workspace

volumes:
  home:
  workspace:
