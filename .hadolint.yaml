# hadolint configuration for ci/lint.sh.
failure-threshold: warning
ignored:
  # Fedora package versions are not pinned: the base image is digest-pinned and
  # fedora:45 only ships updates for its release, which the weekly fresh rebuild
  # (freshness workflow) is meant to pick up. Pinning exact versions breaks
  # builds whenever Fedora supersedes a package.
  - DL3008
  # Fedora packages are not version-pinned here (same reason as DL3008).
  - DL3041
  # The Dockerfile creates lutvzn as UID/GID 5997; tests assert the numeric IDs.
  - DL3066
