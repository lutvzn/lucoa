name: Publish container to GHCR

on:
  workflow_dispatch:
    inputs:
      tag_latest:
        description: Also tag as latest (replaces the current latest image)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publishing so concurrent runs do not race to update latest.
concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .

      - name: Run credential-free smoke tests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sh tests/smoke.sh "${IMAGE}:sha-${GITHUB_SHA}"
          sh tests/ssh.sh "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Publish latest when selected
        if: inputs.tag_latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
