name: Publish container to GHCR

# vX.Y.Z tags publish X.Y.Z, X.Y, sha-<commit>, and latest (pre-releases such as
# v1.0.0-rc.1 skip X.Y and latest). Manual runs publish sha-<commit>, plus
# latest only when selected. Optional cosign signing via COSIGN_PRIVATE_KEY.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_latest:
        description: Also tag as latest (replaces the current latest image)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publishing so concurrent runs do not race to update latest.
concurrency:
  group: publish-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      LUCOA_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned CI tools
        run: sh ci/install-tools.sh shellcheck hadolint trivy cosign
      - name: Lint
        run: sh ci/lint.sh
      - name: Build image
        run: sh ci/build.sh lucoa:publish
      - name: Smoke and SSH tests
        run: sh ci/test.sh lucoa:publish
      - name: Vulnerability scan and SBOM
        run: sh ci/scan.sh lucoa:publish
      - name: Push (and sign) image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          LUCOA_TAG_LATEST: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag_latest && 'true' || 'false') || 'auto' }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          LUCOA_IMAGE_NAME=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          export LUCOA_IMAGE_NAME
          sh ci/publish.sh lucoa:publish
      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lucoa-sbom-${{ github.sha }}
          path: |
            .ci/out/sbom.cdx.json
            .ci/out/vulnerabilities.txt
          if-no-files-found: ignore
