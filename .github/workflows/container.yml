name: Container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: |
          for script in build/install-upstream.sh scripts/entrypoint.sh scripts/ssh-shell.sh tests/smoke.sh tests/ssh.sh; do sh -n "$script"; done
          node --check scripts/services.mjs
          node --check scripts/healthcheck.mjs
          node --check tests/http.mjs
          node --check tests/soak.mjs
      - name: Build image
        run: docker build -t lucoa:ci .
      - name: Run credential-free smoke tests
        run: |
          sh tests/smoke.sh lucoa:ci
          sh tests/ssh.sh lucoa:ci
